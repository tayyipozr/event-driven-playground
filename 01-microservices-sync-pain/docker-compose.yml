name: sync-pain

# Shared settings for both databases.
x-postgres: &postgres
  image: postgres:18.6-alpine
  mem_limit: 256m
  restart: "no"
  healthcheck:
    # -h 127.0.0.1 forces a TCP check. During first-time init the image runs a temporary
    # server that only listens on a Unix socket, so a socket check could report "ready" too early.
    # $$ escapes $ for Compose, so the variable is expanded inside the container.
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s

services:
  orders-db:
    <<: *postgres
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/18/docker, so mount the parent.
      - orders-db-data:/var/lib/postgresql

  payments-db:
    <<: *postgres
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - payments-db-data:/var/lib/postgresql

  payment-service:
    build:
      context: .
      dockerfile: src/PaymentService/Dockerfile
    image: syncpain/payment-service:local
    environment:
      # Inside the Compose network: service name + container port (5432), not the host port.
      ConnectionStrings__Payments: "Host=payments-db;Port=5432;Database=payments;Username=payments;Password=payments"
    ports:
      - "127.0.0.1:5002:8080"
    depends_on:
      payments-db:
        condition: service_healthy
    mem_limit: 256m
    restart: "no"

  order-service:
    build:
      context: .
      dockerfile: src/OrderService/Dockerfile
    image: syncpain/order-service:local
    environment:
      ConnectionStrings__Orders: "Host=orders-db;Port=5432;Database=orders;Username=orders;Password=orders;Maximum Pool Size=5"
      PaymentService__BaseUrl: "http://payment-service:8080"
      # Taken from the shell or a .env file; falls back to CommitThenCall.
      Checkout__Strategy: "${CHECKOUT_STRATEGY:-CommitThenCall}"
    ports:
      - "127.0.0.1:5001:8080"
    # Only the database is a startup dependency. Payment is a runtime dependency on purpose:
    # experiment 1 stops it while Order keeps running.
    depends_on:
      orders-db:
        condition: service_healthy
    mem_limit: 256m
    restart: "no"

volumes:
  orders-db-data:
  payments-db-data: