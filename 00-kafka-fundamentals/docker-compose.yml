# Module 00 - 3-node Apache Kafka cluster in KRaft combined mode + Kafka UI
name: kafka-fundamentals

# ---------------------------------------------------------------------------
# Settings shared by all Kafka nodes (YAML anchor, merged into each node below)
# ---------------------------------------------------------------------------
x-kafka-env: &kafka-env
  # --- KRaft (no ZooKeeper) ---
  CLUSTER_ID: "3_3M1tvwRY6aI6ngabRnHA"
  # Each node is BOTH a broker (stores data, serves clients) and a controller (manages metadata)
  KAFKA_PROCESS_ROLES: broker,controller
  # Static quorum: the 3 controller voters, format is nodeId@host:port
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

  # --- Listeners: where the process BINDS inside the container ---
  # PLAINTEXT :9092 -> other containers (inter-broker replication, kafka-ui)
  # CONTROLLER :9093 -> KRaft quorum traffic only
  # EXTERNAL  :9094 -> clients on the Windows host (mapped to N9092 on the host)
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  # --- Internal topics: survive the loss of one node ---
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2

  # --- Behaviour ---
  # Topics must be created explicitly (partitions + replication factor chosen on purpose)
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # Dev convenience: consumer groups start immediately instead of waiting 3s
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data

  # --- Memory: keep the JVM small for a 16 GB laptop ---
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

# Settings shared by all Kafka node containers
x-kafka-node: &kafka-node
  image: apache/kafka:4.3.1
  # 512 MB heap + JVM overhead + room for CLI tools we run via `docker compose exec`
  mem_limit: 1536m
  # No auto-restart: in the break step we kill nodes and want them to STAY dead
  restart: "no"
  healthcheck:
    # Cheap TCP check (no extra JVM): is the broker listener accepting connections?
    test: ["CMD", "bash", "-c", "</dev/tcp/localhost/9092"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

services:
  kafka-1:
    <<: *kafka-node
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      # What this node TELLS clients about itself (returned in metadata responses)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092
    ports:
      - "127.0.0.1:19092:9094"
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-node
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:29092
    ports:
      - "127.0.0.1:29092:9094"
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-node
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:39092
    ports:
      - "127.0.0.1:39092:9094"
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    mem_limit: 512m
    ports:
      # Bound to localhost only: never expose this UI to the network
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-3-node
      # List all nodes: bootstrap still works if one of them is down
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      JAVA_OPTS: -Xms128m -Xmx256m
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data: